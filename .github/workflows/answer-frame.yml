# The answer frame in a browser (tests/answer_frame_check.py; docs/answer-frame.md): the messages to the parent page, the size at 390 px, one answer from a pick and Send, two frames of one item,
# and who may frame it. A browser shows what the scenario suites cannot (frame-ancestors, postMessage, BroadcastChannel), and tests.yml's suites install none.
# DEVIATION from "every check runs in tests.yml", with its reason: this one needs a browser download, so it runs on its own and only when what it covers can have changed.
name: answer-frame
on:
  pull_request:
    paths:
      - "stackshot/**"
      - "stackshot.example.toml"
      - "tests/answer_frame_check.py"
      - "tests/_*.py"
      - "tests/run-suite"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/answer-frame.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  answer-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # the checkout
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # as in tests.yml
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: the browser (Chromium, at the locked playwright version)
        run: |
          export UV_PROJECT_ENVIRONMENT="$HOME/.cache/stackshot/test-venv"   # the environment tests/run-suite uses
          uv run --locked --only-group tests playwright install --with-deps chromium
      - name: the check
        env:
          ANSWER_FRAME_SHOTS: ${{ runner.temp }}/answer-frame-shots
        run: tests/run-suite answer_frame_check
      - name: the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer-frame-screenshots
          path: ${{ runner.temp }}/answer-frame-shots
          if-no-files-found: ignore
          retention-days: 7
