# The scenario suites, on every pull request and on main. They run on fixture data in a temp dir: no store, no
# network beyond what uv needs to fetch fastmcp. A PR is merged by the builder (example-engineer) only when this is green, and, unless it is a small change, after a fresh reviewer subagent has read it.
# THE GATE. The merge queue's run is the full run, PLAIN; main's push only checks that it happened. Per event:
#   * a pull request runs only the suites its own change reaches by the newest map (tests/suitemap.py select --base HEAD^1; the reasons are in the job summary), and all of them when the map is missing or the pull request changes the harness itself.
#     HEAD is refs/pull/N/merge, whose first parent is the tip of the base branch: the files counted are the pull request's alone, each diffed from the map's commit (not what main merged since the map). So a pull request's run can miss
#     a suite whose reads changed on main after the map was made; the merge queue runs every suite before anything merges, and catches it there. The two jobs that select check out two commits deep (`fetch-depth: 2`) for that parent.
#     The selection is made once, by the `shards` job. A small one (fewer than SHARD_MIN = 40 suites, tests/suitemap.py) runs in the `suites` job as it always did; a large one (a harness change, a missing map and a wide change all give about 200 suites, 22 minutes serially)
#     runs in the same six shards a merge-queue entry uses, PLAINLY (`suitemap.py run`), and the `suites` job only judges it (step "run the selection, sharded");
#   * a GitHub merge-queue entry (`merge_group`) runs EVERY suite, plainly, on the entry's head: `shards` (the plan), six `measure` jobs (each runs its list with suitemap's `run --report`, nothing is traced, no map is made),
#     then `suites` downloads the six reports, has `suitemap.py complete` check that every suite of the commit ran exactly once and none failed, and says so in its step "run every suite, measured". The map is not made here: the scheduled
#     workflow suitemap-refresh.yml measures every suite every 3 hours and keeps the map pull requests pick by (see below). A traced run costs about twice a plain one (a queue stage of 18 minutes against 9 to 11);
#   * a push to main starts with the job `proof`. It finds the merge-queue run of that same commit (a completed, successful `tests` run of event merge_group with this head_sha) and reads from the jobs of that run that the step
#     "run every suite, measured" of its `suites` job concluded success: that step is the completeness check above, so every suite of this commit ran and none failed. Accepted ("proven"): the shards and the six measure jobs are skipped and the `suites` job
#     runs no suite, saying so in its step "run every suite, measured". Not proven (no merge-queue run, a step that is not green, any error in `proof`): main runs the same plain sharded flow an entry runs;
#   * a push to a release-queue branch (`queue/**`) and a manual run are as before (see below).
# The map and the audit of the selection ("audit the selection") are made by suitemap-refresh.yml, not here: a run of this file makes no map, saves no cache and publishes no artifact.
#
# DEVIATIONS from the usual way of doing this, each with its reason (CONTRIBUTING.md, "Suite selection", has the same list):
#   D1  A pull request selects its suites by a measured map instead of running them all (usual: the same full CI on the pull request and in the queue). A full run is eight jobs and about 10 minutes a push, and a pull request is
#       pushed many times; the queue's full run is the backstop and tests the exact tree that lands.
#   D2  A push to main does not run the suites again when the merge queue proved the same commit (usual: CI also runs on every push to main). It would test an identical tree twice. Any commit the queue did not test (a plain merge
#       with the ruleset off, an admin merge, a `queue/**` landing, an expired run) still gets the whole run.
#   D3  The suite map is made by a scheduled workflow, off the gate, and travels as an artifact and a cache entry (usual: the same CI run that gates a change also measures it). Tracing every suite is what made the queue stage 18 minutes instead of 10,
#       and a pick only needs a map that is hours old: `select` diffs each file a pull request changes from the map's commit, and a suite it misses because main changed what it reads since then is run by the queue (D1).
#   D4  release.sh will deploy from a merge-queue run it reads, instead of waiting for a push run (usual: a deploy workflow triggered by the push). Deploy is a script on the server box, not a workflow.
#   D5  The step "run every suite, measured" keeps its name though nothing is measured in this file any more (on an entry and on an unproven main it is the completeness check; on a proven main it says which merge-queue run proved the commit). release.sh and the suites read the name.
# Dependencies are pinned: the package has one pyproject.toml and one uv.lock, and the suites run with --locked against it (the `tests` dependency group); the first step fails when uv.lock is stale.
# No script carries a PEP 723 header or a lock of its own any more (the root forwarders that had them are gone); the second step stays as the guard: a tracked script that grows a header must carry a <script>.lock,
# and it fails when that lock no longer matches. The units run the package: `uv run --locked --extra ... stackshot <program>`.
# The suites run in ONE environment: tests/run-suite is `uv run --locked --only-group tests python <suite>` with
# UV_PROJECT_ENVIRONMENT at ~/.cache/stackshot/test-venv, so a checkout path no longer builds a new
# set of environments in uv's cache, and a stale uv.lock fails the suite instead of resolving afresh.
# The suites are every tests/*_scenario.py: a new suite is a new file, not an edit here.
# THE FULL RUN IN SHARDS. The full run was one long job on one runner (and every release waited for it) while the
# other runners sat idle. In a full run the `shards` job makes the plan once (tests/suitemap.py plan --of 6: every suite in exactly one of six lists, balanced by
# the newest map's measured times, or by a hash of the name without a map) and hands the six lists on as outputs; the `measure` job is a matrix of 6 jobs, each
# running the list it is given plainly (so a cache miss in one of them cannot change what it runs) and, on an entry and on main, handing its report on as an
# artifact. The `suites` job then has `tests/suitemap.py complete` check the reports: each suite of this commit in exactly one report, none failed. Its step "run every suite, measured" passes only when the plan and every shard passed and that check passed.
# release.sh (main_green) reads that step's name, in the `suites` job. A queue branch's push and a manual run do not use the shards (both jobs are
# skipped) and run in the `suites` job as before; a pull request uses them only for a large selection (below). `shards` and `measure` need `proof` and carry `!cancelled()`: `proof` is skipped on every event but a push to main, and a skipped need would skip them too.
#
# A LARGE PULL REQUEST SELECTION IN SHARDS. On a pull request the `shards` job first makes the selection (step "the suites the change reaches": `suitemap.py select`, the failure of which is every suite, as ever) and hands it on as its output `selected`, then plans only those
# suites (`suitemap.py plan --of 6 --only <them>`), which also prints `large=true` when they number SHARD_MIN or more. When `large` is true the `measure` matrix runs, each shard running its list (step "run this shard's suites": `suitemap.py run`, a suite gets SUITE_T),
# and the `suites` job skips its own selection and judges the run in the step "run the selection, sharded" (the plan and every shard must each be `success`: a skipped shard counts as passing for GitHub, not for this step).
# When `large` is not true the `suites` job runs the selection the plan job handed on (when the plan job failed it selects for itself: the run is then serial, as before the shards). The cost of the sharded way: one more job before the suites (about a minute) and up to six runners
# instead of one for the minutes of the run; the serial way stays under SHARD_MIN suites, where it is within a minute or two of the sharded one. A merge-queue entry and main's push use the same shards, whole, and so are a queue branch's push and a manual run unchanged.
#
# THE RELEASE QUEUE'S BRANCHES. A push to a branch named `queue/**` (the queue's stacked group branches: main plus the waiting PRs merged on top) is a `push` event too, but it gets the run a
# pull request gets, not the full one: the `proof`, `shards` and `measure` jobs are skipped and the `suites` job runs the selection step ("run the suites the change reaches": `suitemap.py select --map .suitemap/map.json --to HEAD`, with no
# `--base` (and no origin/main in its checkout to take one from), so it compares the newest map's commit with the group's head and sees the group's PRs and whatever main did since the map; any failure of the selection runs every suite, as for a PR). Observed, not measured here: a queue branch's full sharded run takes several times as long as a PR's selected run.
# The job keeps its name `suites`: it is the check mq reads on the group's head (.github/mergequeue.toml: `required`; `suites = "select"` is the setting that says the workflow does this, and
# tests/suitemap_scenario.py fails when the two disagree). Its result is read by the commit (`salamander ci-runs howardpark-ai/stackshot --sha <sha>`; the poller file lists the run with its head_branch and event `push`).
# A queue run gives no map, and nothing in it is a proof for main: the proof reads a merge-queue run only. The poller keeps the newest 30 runs of the repository, so a queue branch's run (three or four workflow runs a push) pushes main's older ones out of that window sooner.
#
# GITHUB'S MERGE QUEUE (`merge_group`). The repository has a `merge_queue` ruleset on main (`main merge queue`, ACTIVE; `disabled` is the way back, and then a push to main runs the whole flow, as any unproven one does).
# GitHub's queue tests an entry on a branch it makes, `gh-readonly-queue/main/pr-<n>-<sha>`, and starts the workflows that trigger on `merge_group` (types: checks_requested) for it; the required check on main is the job
# `suites` (app GitHub Actions). A job that is skipped reports as passing, so `suites` must never be skipped on this event: its `if` is `!cancelled()`, and tests/suitemap_scenario.py evaluates it (and the verdict step's) for a merge_group event.
# The entry's run is the full sharded flow described under THE GATE. The branch is NOT in the `push` list above: the merge_group event is the trigger, and a push trigger as well would run every entry twice.
# Differences of the event, all handled in this file: it has no pull_request context (so the tool-text job, which reads the PR, skips, as it does on a queue/** push),
# `github.sha` is the entry's head (`github.event.merge_group.head_sha`; actions/checkout takes the ref and the SHA from the event's context and fetches by SHA), `github.event.before` is empty, and `github.ref` is the entry's own branch, so the concurrency group is its own and
# a newer entry never cancels an older one. The plan reads the newest saved map (the refresh's, from main's cache) for the times it balances by. The ruleset's check_response_timeout_minutes is how long an entry may take: a full run must fit in it. tests/suitemap_scenario.py evaluates the `if:` of every job and every step for each event
# and fails when a run differs from what is written here.
#
# WHERE THE JOBS RUN. Every job of this file and of clean-text.yml runs on GitHub's hosted runners (`ubuntu-latest`); no repository variable is needed.
# A step that makes sense only on a hosted runner (it installs what a machine set up by hand would already have) is gated on `runner.environment == 'github-hosted'`, which is true
# exactly where the job runs on one. CONTRIBUTING.md, "Where CI runs", has the whole account.
name: tests
on:
  pull_request:
  push:
    branches: [main, 'queue/**']   # main: the proof job, and the full run when the commit is not proven; queue/** : the release queue's stacked group branches (main plus the waiting PRs): a pull request's run (the selection), see THE RELEASE QUEUE'S BRANCHES above
  merge_group:             # GitHub's native merge queue: the entry's run is the full gate (every suite, plainly), see THE GATE and GITHUB'S MERGE QUEUE above; not in `push` (that would run it twice)
    types: [checks_requested]
  workflow_dispatch:       # a manual run on a branch: gh workflow run tests.yml --ref <branch> [-f suites="pilot release"]
    inputs:
      suites:
        description: suites to run, space-separated names (pilot, release …); empty runs every suite, plainly (no map, no measuring)
        type: string
        default: ""
# A new push to a PR cancels that branch's older run, queued or running, so superseded runs stop holding the one runner. A run on main (or a queue branch, or a merge-queue entry: cancel-in-progress is true for pull_request only) is never cancelled while it runs; a newer main run waiting replaces an older one waiting (GitHub keeps one pending run per group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The proof of a push to main (see THE GATE above): did the merge queue already run every suite on this very commit? It finds that run (event merge_group, this head_sha, this workflow's file, completed and successful, the newest)
  # and reads the jobs of that run: its `suites` job must show the step "run every suite, measured" with the conclusion success, which on an entry is the check that every suite of the commit ran once and none failed (tests/suitemap.py complete).
  # The answer is the job's output `proven`: when it is `true` the shards and the measure jobs are skipped and the `suites` job runs no suite. The job never fails the run: `continue-on-error` at the job and on every step that can fail,
  # so a GitHub hiccup, an expired run or a 404 means `proven=false` and the whole run, never a red main or a skipped test. It asks for `actions: read` (the run list and the jobs of the same repository) and nothing else, and needs no checkout; it runs on a push to main only.
  proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: merge-queue proof
    runs-on: ubuntu-latest   # it reads one run
    timeout-minutes: 10
    continue-on-error: true   # whatever goes wrong here is "not proven", never a failed run
    permissions:
      actions: read    # the merge-queue run of this commit and its jobs
    outputs:
      proven: ${{ steps.final.outputs.proven }}
      run_id: ${{ steps.final.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: find the merge-queue run of this commit
        id: find
        continue-on-error: true
        run: |
          # the newest completed, successful run of this workflow's file for event merge_group on this head (the list gives each run's latest attempt)
          id=$(gh api "repos/$REPO/actions/runs?event=merge_group&head_sha=$GITHUB_SHA&per_page=10" --jq '[.workflow_runs[] | select((.path | startswith(".github/workflows/tests.yml")) and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty') || id=
          case $id in ''|*[!0-9]*) echo "no successful merge-queue run of $GITHUB_SHA found"; id= ;; esac
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          [ -z "$id" ] || echo "merge-queue run $id"
      - name: that run checked every suite
        id: ran
        if: steps.find.outputs.run_id != ''
        continue-on-error: true
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          # the run is green as a whole; read from its jobs that the check of completeness itself was not skipped: exactly one step of that name, in the job named suites, concluded success
          n=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "suites") | .steps[] | select(.name == "run every suite, measured" and .conclusion == "success")] | length')
          [ "$n" = 1 ] || { echo "the merge-queue run $RUN_ID has no green step \"run every suite, measured\" in its suites job (found: ${n:-none})"; exit 1; }
          echo "merge-queue run $RUN_ID checked that every suite ran"
          {
            echo "### Merge-queue proof"
            echo "**Proven:** the merge queue ran every suite on this commit in run $RUN_ID, and none failed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the proof
        id: final
        if: always()
        env:
          RAN: ${{ steps.ran.outcome }}
          FOUND: ${{ steps.find.outputs.run_id }}
        run: |
          if [ "$RAN" = success ]; then
            echo "proven=true" >> "$GITHUB_OUTPUT"; echo "run_id=$FOUND" >> "$GITHUB_OUTPUT"
            echo "proven: every suite ran green in merge-queue run $FOUND on this commit"
          else
            echo "proven=false" >> "$GITHUB_OUTPUT"
            echo "not proven (find: ${FOUND:-none}, check: $RAN): the whole run follows"
          fi
  # The full run, split in two jobs (a merge-queue entry, and a push to main that is not proven; a queue branch's push skips both: skipped counts as passing; a pull request runs them for a large selection only, see A LARGE PULL REQUEST SELECTION IN SHARDS). `shards` makes the plan ONCE: it reads the newest map and
  # puts every suite in exactly one of the 6 lists (tests/suitemap.py plan: balanced by the map's measured times, or by a stable hash of the name when the map is missing, which is
  # also what a cache miss here gives), and hands the six lists on as job outputs. `measure` is a matrix of 6 jobs, each running the list
  # it is given and nothing else, so a cache miss in one of them cannot make it plan differently from the others (a suite run twice, or by none). The shard count is in two places,
  # the matrix and --of below; tests/suitemap_scenario.py checks that they agree with tests/suitemap.py's SHARDS, that every suite is in exactly one list, and that every shard reads the plan.
  shards:
    needs: proof
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.proof.outputs.proven != 'true') || github.event_name == 'merge_group' || github.event_name == 'pull_request') }}   # an entry, a push to main the queue did not prove, or a pull request (it makes the selection and decides whether the shards run); `!cancelled()` because `proof` is skipped on an entry and a skipped need would skip this job
    name: main shard plan
    runs-on: ubuntu-latest   # it only reads a map and lists suites
    timeout-minutes: 15
    outputs:
      shard0: ${{ steps.plan.outputs.shard0 }}
      shard1: ${{ steps.plan.outputs.shard1 }}
      shard2: ${{ steps.plan.outputs.shard2 }}
      shard3: ${{ steps.plan.outputs.shard3 }}
      shard4: ${{ steps.plan.outputs.shard4 }}
      shard5: ${{ steps.plan.outputs.shard5 }}
      large: ${{ steps.plan.outputs.large }}        # a pull request only: `true` when its selection is large (SHARD_MIN suites or more) and runs in the shards
      selected: ${{ steps.select.outputs.selected }}   # a pull request only: the suites its change reaches, which the `suites` job runs when the selection is not large
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # the selection of a pull request counts its change from HEAD^1, the base tip of refs/pull/N/merge
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: the one test environment
        run: echo "UV_PROJECT_ENVIRONMENT=${XDG_CACHE_HOME:-$HOME/.cache}/stackshot/test-venv" >> "$GITHUB_ENV"
      # the newest map, for the measured times the plan is balanced by (and, on a pull request, for the selection). No map (a cache miss): the plan is the hash plan, for all six lists alike. The refresh saves each map under its own key (suitemap-<commit>-<run>),
      # so the exact key never exists and the newest saved map is the one restored: that is how a cache entry is read here
      - name: the suite map
        uses: actions/cache/restore@v4
        with:
          path: .suitemap/map.json
          key: suitemap-newest
          restore-keys: suitemap-
      # A pull request only: the selection, made here once (the same command and fallback the `suites` job used to run itself). A failed selection is every suite. The output is one line: the names, separated by spaces
      - name: the suites the change reaches
        id: select
        if: github.event_name == 'pull_request'
        run: |
          sel=$(uv run --locked --only-group tests python tests/suitemap.py select --map .suitemap/map.json --to HEAD --base HEAD^1) \
            || { echo "::warning::the suite selection failed: running every suite"; sel=all; }
          if [ "$sel" = all ]; then sel=$(uv run --locked --only-group tests python tests/suitemap.py list); fi
          sel=$(echo $sel)   # one line, single spaces: a job output is one line
          [ -n "$sel" ] || echo "no suite is reached by this change"
          echo "selected=$sel" >> "$GITHUB_OUTPUT"
      - name: plan the shards
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SELECTED: ${{ steps.select.outputs.selected }}
        run: |
          set -o pipefail   # the default shell has no pipefail: a failing plan must fail the step, not hide behind tee's exit status
          case $SELECTED in *[!a-z0-9_\ ]*) echo "the selection holds only names of suites, separated by spaces"; exit 2 ;; esac
          only=
          [ "$EVENT" != pull_request ] || only="--only $SELECTED"   # a pull request plans its selection alone (an empty one plans nothing: `--only` with no name); the others plan every suite
          uv run --locked --only-group tests python tests/suitemap.py plan --of 6 --map .suitemap/map.json $only | tee -a "$GITHUB_OUTPUT"
  measure:
    needs: [proof, shards]
    if: ${{ !cancelled() && needs.shards.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.proof.outputs.proven != 'true') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.shards.outputs.large == 'true')) }}   # as `shards`, and only when the plan was made; a pull request only for a large selection
    name: main shard ${{ matrix.shard }}
    strategy:
      fail-fast: false   # one failing shard must not cancel the others: the run's verdict names every failure at once
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest   # the full run's shards (job id kept from when they measured: nothing is traced here now)
    timeout-minutes: 60   # a shard runs about 50 suites plainly in 8 to 10 minutes; a suite that hangs is stopped by its own limit (SUITE_T)
    env:
      SUITE_T: 900       # seconds a suite gets on a plain run (as in the suites job)
      CAIO_IMPL: linux
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: the one test environment
        run: echo "UV_PROJECT_ENVIRONMENT=${XDG_CACHE_HOME:-$HOME/.cache}/stackshot/test-venv" >> "$GITHUB_ENV"
      # This shard's list of the plan, plainly: no strace, no coverage, no map read or made. It writes a report of what it ran (which suite, whether it passed), which the `suites` job checks on an entry and on main. The list is not decided here: it comes from the plan job, the same for every shard
      - name: run this shard's suites
        env:
          SHARD: ${{ matrix.shard }}
          SELECTED: ${{ needs.shards.outputs[format('shard{0}', matrix.shard)] }}
        run: |
          case $SELECTED in *[!a-z0-9_\ ]*) echo "the plan holds only names of suites, separated by spaces"; exit 2 ;; esac
          [ -n "$SELECTED" ] || { echo "shard $SHARD has no suite"; exit 0; }
          echo "shard $SHARD: $SELECTED"
          exec uv run --locked --only-group tests python tests/suitemap.py run -T "$SUITE_T" --report ".suitemap/run-$SHARD.json" $SELECTED   # exec: a cancel's signal reaches suitemap.py
      # A shard with no suite (none today) writes no report and the check does not need one: it counts suites, not shards. A pull request's judge reads the job results alone, so it takes no report
      - name: hand the shard's report on
        if: always() && github.event_name != 'pull_request' && hashFiles('.suitemap/run-*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: suiterun-shard-${{ matrix.shard }}
          path: .suitemap/run-${{ matrix.shard }}.json
          include-hidden-files: true   # under the hidden folder .suitemap
          retention-days: 1
          overwrite: true   # a re-run of the job (same run id) uploads the same artifact name again; without this the second upload fails
  suites:
    # The gate (see THE GATE above). On a merge-queue entry and on a push to main that is not proven, this job runs after the plan and the shards (needs; `!cancelled()` so that a failing shard still gets its verdict here) and checks their reports.
    # On a push to main that the proof job proved it runs no suite: it says so. On a queue branch the proof, the plan and the shards are skipped (skipped needs do not stop it) and it runs the selection itself. On a pull request the plan job has made the selection: a small one runs here (the selection the plan job handed on), a large one ran in the shards and is only judged here.
    # It is never skipped on a merge_group event: GitHub counts a skipped job as passing, and this is the merge queue's required check (tests/suitemap_scenario.py evaluates this `if` for it).
    needs: [proof, shards, measure]
    if: ${{ !cancelled() }}
    # Runs on GitHub's hosted runners (ubuntu-latest, 2 cores).
    runs-on: ubuntu-latest   # on an entry and on main it only checks the shards' reports (or says the commit is proven)
    # 180 min: a short limit once cancelled a passing run (a hosted runner is small and has no slot to wait for).
    # Each suite has its own limit (SUITE_T below).
    timeout-minutes: 180   # a generous limit on a hosted runner (small, no slot to wait for; to be tightened once measured)
    env:
      SUITE_T: 900        # seconds one suite gets on a plain run; a hosted runner has 2 cores
      CAIO_IMPL: linux   # as stackshot.service: avoids an io_uring fault on some hosts
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # scratch goes to the runner's temp folder, which the runner empties after each job. The runner context is not available in a job-level env, so this is a step
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # a pull request's own selection (the fallback below) counts its change from HEAD^1, the base tip of refs/pull/N/merge
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: the one test environment
        run: echo "UV_PROJECT_ENVIRONMENT=${XDG_CACHE_HOME:-$HOME/.cache}/stackshot/test-venv" >> "$GITHUB_ENV"
      - name: uv.lock is current
        run: uv lock --check
      - name: every script's lock is present and current
        run: |
          fail=0
          for f in $(git ls-files '*.py'); do
            grep -q '^# /// script' "$f" || continue
            if [ ! -f "$f.lock" ]; then echo "missing lock: $f.lock (run: uv lock --script $f)"; fail=1; continue; fi
            if ! uv lock --script "$f" --check; then echo "stale lock: $f.lock (run: uv lock --script $f)"; fail=1; fi
          done
          exit $fail
      # The newest map, which the refresh saved to main's cache (a pull request and an entry read main's cache: a cache saved on a merge-queue ref is not readable from anywhere else): the one the selection steps below pick by.
      - name: the suite map
        uses: actions/cache/restore@v4
        with:
          path: .suitemap/map.json
          key: suitemap-newest
          restore-keys: suitemap-
      # One suite gets 10 minutes (900 hosted; the longest, pilot and page_currency, take one or two): a hung suite fails on
      # its own with the traceback of where it sat (SIGINT), and the suites after it still run, instead of the whole job
      # sitting until its limit cancels it with no trace (github's pacer waiting out the hour).
      # A small pull request selection, and a push to a queue branch (the group's head: main plus the waiting PRs): the newest map from main, `--to HEAD` (a pull request's was made by the plan job and is taken from it). A pull request's own selection here passes `--base HEAD^1` and
      # counts its change alone; a queue push passes no base, so `select` compares the map's commit with HEAD (a queue head holds main plus the group, and all of it counts). The map's commit is fetched when the checkout, two commits deep, lacks it. On a queue push the restore finds no key of its own, so it takes the newest `suitemap-` entry.
      # A merge-queue entry does not select: it runs every suite, plainly, in the shards.
      - name: run the suites the change reaches
        if: (github.event_name == 'pull_request' && needs.shards.outputs.large != 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/queue/'))   # not a manual run on a queue ref: that runs the step below; not a large pull request selection: the shards ran it
        env:
          EVENT: ${{ github.event_name }}
          PLAN: ${{ needs.shards.result }}
          HANDED: ${{ needs.shards.outputs.selected }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$PLAN" = success ]; then
            sel=$HANDED   # the plan job's selection, the one it judged small: this job and the plan cannot disagree (the map in the cache may be newer by now)
            case $sel in *[!a-z0-9_\ ]*) echo "the selection holds only names of suites, separated by spaces"; exit 2 ;; esac
          else   # a queue branch, or a pull request whose plan job failed (then it is a serial run, as before the shards)
            base=; if [ "$EVENT" = pull_request ]; then base="--base HEAD^1"; fi   # a queue branch counts everything since the map
            sel=$(uv run --locked --only-group tests python tests/suitemap.py select --map .suitemap/map.json --to HEAD $base) \
              || { echo "::warning::the suite selection failed: running every suite"; sel=all; }
            if [ "$sel" = all ]; then sel=$(uv run --locked --only-group tests python tests/suitemap.py list); fi
          fi
          [ -n "$sel" ] || { echo "no suite is reached by this change"; exit 0; }
          # -T 600 again (900 hosted): the stopgap 900 was for the release suite's waits starting extra Python processes, before the shell stubs and the short give-up caps
          # exec: a cancel signals this shell alone; uv in its place forwards INT and TERM to suitemap.py, which stops the suite
          exec uv run --locked --only-group tests python tests/suitemap.py run -T "$SUITE_T" $sel
      # A manual run (gh workflow run): the suites named in the `suites` input, else every suite, plainly. No map: it is for trying a runner, not for judging a change.
      - name: run the suites named, or every suite
        if: github.event_name == 'workflow_dispatch'
        env:
          SUITES: ${{ inputs.suites }}      # data, never shell text; checked below
        run: |
          case $SUITES in *[!a-z0-9_\ ]*) echo "the suites input holds only names of suites, separated by spaces"; exit 2 ;; esac
          [ -n "$SUITES" ] || SUITES=$(uv run --locked --only-group tests python tests/suitemap.py list)
          exec uv run --locked --only-group tests python tests/suitemap.py run -T "$SUITE_T" $SUITES
      # A large pull request selection, run by the shards (the measure job, plainly): this job judges it. Like the verdict step below it is what keeps a skipped or failed shard from passing the required check, since GitHub counts a skipped job as passing
      - name: run the selection, sharded
        if: github.event_name == 'pull_request' && needs.shards.outputs.large == 'true'
        env:
          PLAN: ${{ needs.shards.result }}
          SHARDS: ${{ needs.measure.result }}
        run: |
          [ "$PLAN" = success ] || { echo "::error::the plan of the selection was not made (plan: $PLAN): see the shard plan job"; exit 1; }
          [ "$SHARDS" = success ] || { echo "::error::a shard of the selection did not pass (shards: $SHARDS): see the shards' jobs"; exit 1; }
          echo "every shard of the selection passed"
      # A merge-queue entry, and a push to main (the steps down to the verdict skip on a pull request and on a queue branch). On an entry, and on a push to main the proof job did not prove, the shards ran every suite plainly (the measure job);
      # their reports come here and `suitemap.py complete` checks them: this commit's suites each in exactly one report, none failed. On a push to main the proof job proved there are no shards and no reports.
      - name: the shards' reports
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.proof.outputs.proven != 'true') || github.event_name == 'merge_group'
        uses: actions/download-artifact@v4
        with:
          pattern: suiterun-shard-*
          path: .suitemap/ran
          merge-multiple: true
      - name: check that every suite ran
        id: check
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.proof.outputs.proven != 'true') || github.event_name == 'merge_group'
        continue-on-error: true   # judged by the next step, which names what is wrong
        run: |
          set -- .suitemap/ran/run-*.json
          [ -e "$1" ] || { echo "::error::no shard handed on a report"; exit 1; }
          uv run --locked --only-group tests python tests/suitemap.py complete "$@"
      # release.sh (main_green) reads this step's name: its deploy waits for it on main. It passes only when the plan and every shard passed and the check found every suite of this commit once, none failed; on a proven commit (the same name, nothing run here) at once, saying which run proved it.
      - name: run every suite, measured
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group'
        env:
          PROVEN: ${{ needs.proof.outputs.proven }}
          RUN_ID: ${{ needs.proof.outputs.run_id }}
          PLAN: ${{ needs.shards.result }}
          SHARDS: ${{ needs.measure.result }}
          CHECKED: ${{ steps.check.outcome }}
        run: |
          if [ "$PROVEN" = true ]; then
            echo "every suite ran green in merge-queue run $RUN_ID on this commit (read by the proof job): nothing was run here"
            exit 0
          fi
          [ "$PLAN" = success ] || { echo "::error::the plan of the full run was not made (plan: $PLAN): see the shard plan job"; exit 1; }
          [ "$SHARDS" = success ] || { echo "::error::a shard of the full run did not pass (shards: $SHARDS): see the shards' jobs"; exit 1; }
          [ "$CHECKED" = success ] || { echo "::error::the shards' reports do not show every suite run once and none failed (check: $CHECKED): see the step above"; exit 1; }
          echo "every shard passed, and every suite of this commit ran once"
  # The tool's text changes in the same release as the tool: a pull request that changes the body of an MCP tool
  # function, of an output helper (tools/tool_text.py HELPERS) or of a tool's text file (stackshot/web/tools/text/*.md) while tests/tool_text.snapshot.json is unchanged fails here, unless its body has the line
  # `tool-text: unchanged: <reason>`. The other two gates run in the suites job as suites: tool_text (the live registry equals the snapshot) and retired_terms.
  # No model reads the text in CI: whether the words still say what the code does is read before the merge by the maintainer's reviewer subagent (CONTRIBUTING.md, "The tool-text gates", item 4).
  # It needs no token beyond the job's own: the body is read with `gh pr view` (so a re-run after the author added the line sees it; the event's copy, with a
  # warning, when gh cannot), and every value of the event goes in through env, never into the shell text. The job asks for `pull-requests: read`: the
  # repository's default token has no pull-request access, so on a repository with that default the read failed every time, unseen, and a re-run judged the body
  # of the push that started the run.
  tool-text:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # the checkout
      pull-requests: read   # gh pr view: the PR body as it is now (see above)
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # scratch goes to the runner's temp folder, which the runner empties after each job. The runner context is not available in a job-level env, so this is a step
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the fork point of the PR and main is the base of the comparison
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: a tool function or output helper changed with its text
        run: |
          body="$RUNNER_TEMP/pr-body.txt"
          trap 'rm -f "$body" "$body.err"' EXIT   # remove them pass or fail
          if ! gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body > "$body" 2> "$body.err"; then
            echo "::warning::the PR body could not be read now ($(head -n 1 "$body.err")): this run uses the copy from the event that started it, so an edit since then is not seen"
            printf '%s' "$PR_BODY" > "$body"
          fi
          uv run --no-project python tools/tool_text.py touched --base "$BASE_SHA" --head "$HEAD_SHA" --body-file "$body"
