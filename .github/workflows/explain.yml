# The explainer "?" in a browser (tests/explain_check.py; CONTRIBUTING.md, Page text): the popup inside a 360 px screen, tap, hover, keyboard, light and dark. A browser shows what the scenario
# suites cannot (layout, stacking, colors, touch), and tests.yml's suites install none.
# DEVIATION from "every check runs in tests.yml", with its reason: as in answer-frame.yml, this one needs a browser download, so it runs on its own and only when what it covers can have changed.
name: explain
on:
  pull_request:
    paths:
      - "stackshot/web/**"
      - "shared/**"
      - "stackshot.example.toml"
      - "tests/explain_check.py"
      - "tests/_*.py"
      - "tests/run-suite"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/explain.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # the checkout
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # as in tests.yml
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: the browser (Chromium, at the locked playwright version)
        run: |
          export UV_PROJECT_ENVIRONMENT="$HOME/.cache/stackshot/test-venv"   # the environment tests/run-suite uses
          uv run --locked --only-group tests playwright install --with-deps chromium
      - name: the check
        env:
          EXPLAIN_SHOTS: ${{ runner.temp }}/explain-shots
        run: tests/run-suite explain_check
      - name: the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explain-screenshots
          path: ${{ runner.temp }}/explain-shots
          if-no-files-found: ignore
          retention-days: 7
