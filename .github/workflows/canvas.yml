# A canvas in a browser (tests/canvas_check.py; docs/canvas.md): the shell and its frame at 390 px, and that a stored page can neither read nor write the board nor send its frame elsewhere.
# A browser shows what the scenario suites cannot (the sandbox, the content security policy, cookies in a frame), and tests.yml's suites install none.
# DEVIATION from "every check runs in tests.yml", with its reason: this one needs a browser download, so it runs on its own and only when what it covers can have changed.
name: canvas
on:
  pull_request:
    paths:
      - "stackshot/**"
      - "stackshot.example.toml"
      - "tests/canvas_check.py"
      - "tests/_*.py"
      - "tests/run-suite"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/canvas.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # the checkout
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # as in tests.yml
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: the browser (Chromium, at the locked playwright version)
        run: |
          export UV_PROJECT_ENVIRONMENT="$HOME/.cache/stackshot/test-venv"   # the environment tests/run-suite uses
          uv run --locked --only-group tests playwright install --with-deps chromium
      - name: the check
        env:
          CANVAS_SHOTS: ${{ runner.temp }}/canvas-shots
        run: tests/run-suite canvas_check
      - name: the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-screenshots
          path: ${{ runner.temp }}/canvas-shots
          if-no-files-found: ignore
          retention-days: 7
