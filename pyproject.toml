# stackshot: the one Python project of this checkout, locked in uv.lock.
#
#   uv run stackshot <program> ...      run the command line (stackshot/cli.py); `uv run --extra server stackshot server` the board server
#   python3 -m stackshot ...            the same on a box with no uv: the base install needs only the standard library (Python 3.12+)
#   tests/run-suite <name>              a scenario suite, in the `tests` dependency group below
#
# The base install has no dependencies: client, puller, config and push must keep running on a machine with nothing but python3.
# Each extra is what one program needs beyond that. To add or bump a dependency, edit this file and run `uv lock`.
[project]
name = "stackshot"
version = "0"
description = "A task board for Claude Code sessions"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# the MCP server and the board (stackshot/web/server.py), the publisher and ghmigrate, and the tools that read the board
server = ["fastmcp>=4.0,<5", "markdown-it-py>=4,<5"]
# the Slack, Notion, Google and GitHub receiver, and its one-time Google sign-in
anchor-hub = [
    "slack-sdk>=3.33",
    "watchdog>=4",
    "google-auth>=2.35",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
]
# stackshot/tools/make_icons.py
icons = ["resvg-py==0.5.0"]

[dependency-groups]
# the dependency set the scenario suites run with (tests/run-suite installs only this group, not the project)
tests = [
    "coverage>=7.10",   # tests/suitemap.py measures the suites on main; 7.10 brought [run] patch
    "fastmcp>=4.0,<5",
    "httpx",
    "markdown-it-py>=4,<5",
    "playwright==1.63.0",
    "pyyaml",
]

[project.scripts]
stackshot = "stackshot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stackshot"]

[tool.uv]
# no release newer than this is resolved: the lock is reproducible, and a new upload is a change someone chose
exclude-newer = "2026-10-03T04:00:00Z"
