use = "`until=<date>` with `wait_kind=\"time\"` and `wait_basis` for a park"
allow = []

[[term]]
retired = "hold=true with its wake"
use = "`until=<date>` with `wait_kind=\"time\"` and `wait_basis` for a park"
allow = []

[[term]]
retired = "update(hold=true"
use = "`update(until=<date>, wait_kind=\"time\", wait_basis=...)` for a park"
allow = []

[[term]]
retired = "hold=true, until"
use = "`until=<date>` with `wait_kind=\"time\"` and `wait_basis` for a park"
allow = []

# The lint wraps a term in (?<!\w)...(?!\w), so a term ending in `<` never matched `ask_by=<the day to chase>` (a word character follows): the terms end on the first word of the placeholder.
[[term]]
retired = "ask_by=<the"
use = "`until=<day>` for the day a relay, event or item wait comes back (`ask_by` is a retired parameter)"
allow = []

[[term]]
retired = "ask_by=<YYYY"
use = "`until=<YYYY-MM-DD>` for the day a relay, event or item wait comes back (`ask_by` is a retired parameter)"
allow = []

[[term]]
retired = "ask_by=YYYY"
use = "`until=YYYY-MM-DD` for the day a relay, event or item wait comes back"
allow = []

[[term]]
retired = "wake=YYYY"
use = "`until=YYYY-MM-DD` for the date a wait ends on (`wake` is a retired parameter)"
allow = []

[[term]]
retired = "its old name `wake`"
use = "`until` is the one date of a wait; `wake` is a retired parameter"
allow = []
